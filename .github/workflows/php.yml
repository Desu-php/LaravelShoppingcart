name: Package compatibility

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {php: '7.4', laravel: '^8.0', testbench: '^6.0', phpunit: '^9.6', carbon: '^2.0', eol: true}
          - {php: '8.0', laravel: '^9.0', testbench: '^7.0', phpunit: '^9.6', carbon: '^2.0', eol: true}
          - {php: '8.1', laravel: '^10.0', testbench: '^8.0', phpunit: '^10.5', carbon: '^2.67', eol: true}
          - {php: '8.3', laravel: '^10.0', testbench: '^8.0', phpunit: '^10.5', carbon: '^2.67', eol: true}
          - {php: '8.2', laravel: '^11.0', testbench: '^9.0', phpunit: '^11.5', carbon: '^2.72.6', eol: true}
          - {php: '8.2', laravel: '^11.0', testbench: '^9.0', phpunit: '^11.5', carbon: '^3.8.4', eol: true}
          - {php: '8.4', laravel: '^11.0', testbench: '^9.0', phpunit: '^11.5', carbon: '^3.8.4', eol: true}
          - {php: '8.2', laravel: '^12.0', testbench: '^10.0', phpunit: '^11.5', carbon: '^3.8.4'}
          - {php: '8.4', laravel: '^12.0', testbench: '^10.0', phpunit: '^11.5', carbon: '^3.8.4'}
          - {php: '8.3', laravel: '^13.0', testbench: '^11.0', phpunit: '^11.5', carbon: '^3.8.4'}
          - {php: '8.4', laravel: '^13.0', testbench: '^11.0', phpunit: '^11.5', carbon: '^3.8.4'}
          - {php: '8.5', laravel: '^13.0', testbench: '^11.0', phpunit: '^11.5', carbon: '^3.8.4'}
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }} / Carbon ${{ matrix.carbon }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - name: Select test stack
        run: |
          composer require --dev --no-update --no-interaction \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "phpunit/phpunit:${{ matrix.phpunit }}"
          composer require --no-update --no-interaction "nesbot/carbon:${{ matrix.carbon }}"
      - name: Resolve stable dependencies
        # These isolated compatibility jobs intentionally exercise EOL framework
        # dev dependencies. Keep advisories visible below; do not change consumer policy.
        env:
          COMPOSER_NO_SECURITY_BLOCKING: ${{ matrix.eol && '1' || '0' }}
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Record resolved versions
        run: |
          php --version
          composer show laravel/framework
          composer show nesbot/carbon
          composer show orchestra/testbench
          composer show phpunit/phpunit
      - name: Test behavior, integration and legacy data
        run: composer test
      - name: Report dependency advisories
        continue-on-error: ${{ matrix.eol || false }}
        run: composer audit --locked

  postgres:
    name: PostgreSQL storage / Laravel 13 / PHP 8.3
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: shoppingcart
          POSTGRES_PASSWORD: shoppingcart
          POSTGRES_DB: shoppingcart_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shoppingcart -d shoppingcart_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, pdo_sqlite, pdo_pgsql
          coverage: none
          tools: composer:v2
      - name: Select PostgreSQL test stack
        run: |
          composer require --dev --no-update "laravel/framework:^13.0" "orchestra/testbench:^11.0" "phpunit/phpunit:^11.5"
          composer require --no-update "nesbot/carbon:^3.8.4"
          composer update --prefer-dist --no-interaction --no-progress
      - run: composer test:pgsql
